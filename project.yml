name: SunoHelper
options:
  bundleIdPrefix: com.sunohelper
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: Resources/Info.plist
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    URL_CACHE_ENABLED: "NO"

targets:
  SunoHelper:
    type: application
    platform: iOS
    sources:
      - Sources/SunoHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunohelper.app
        PRODUCT_NAME: SunoHelper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SunoHelper.entitlements
    entitlements:
      path: SunoHelper.entitlements
